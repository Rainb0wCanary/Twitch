<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Статистика и логи</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h2>Статистика просмотра</h2>
            <div class="header-actions">
                <button id="createNewGroup" class="btn btn-primary">+ Создать новую группу</button>
            </div>
        </div>

        <!-- Настройки бота / параметров -->
        <div id="configForm" class="card config-card">
            <div class="config-grid">
                <label>
                    <span>URL категории поиска:</span>
                    <input id="searchUrlPartInput" type="text" placeholder="https://www.twitch.tv/directory/category/...">
                </label>
                <label>
                    <span>Интервал (мин):</span>
                    <input id="checkIntervalMinutesInput" type="number" min="1" placeholder="1">
                </label>
                <label>
                    <span>Ожидание перед проверкой (сек):</span>
                    <input id="waitBeforeCheckInput" type="number" min="0" placeholder="20">
                </label>
                <label>
                    <span>Макс. попыток:</span>
                    <input id="maxAttemptsInput" type="number" min="1" placeholder="5">
                </label>
                <label>
                    <span>Временный бан (H.MM.SS):</span>
                    <input id="tempBlacklistSecondsInput" type="text" placeholder="0.05.00">
                </label>
                <div class="config-submit">
                    <button id="saveConfigFormButton" class="btn btn-accent">Сохранить настройки</button>
                </div>
            </div>
        </div>

        <!-- Контейнер карточек групп дропсов -->
        <div id="groupsContainer" class="groups-container"></div>

        <!-- Логи -->
        <div class="page-header" style="margin-top:24px;">
            <h2>Логи работы</h2>
        </div>
        <div id="log" class="card log-card"></div>
        <div class="log-controls">
            <button id="clearLogsButton" class="btn btn-primary">Очистить логи</button>
            <button id="deleteConfigButton" class="btn btn-danger">Удалить конфиг из хранилища</button>
            <button id="uploadConfigButton" class="btn btn-accent">Загрузить JSON конфиг</button>
            <input type="file" id="configFileInput" accept=".json" style="display:none;">
            <label class="logs-checkbox-label">
                <input type="checkbox" id="toggleLogsCheckbox" checked> Вести логирование
            </label>
        </div>
    </div>
    <script src="stats.js"></script>
</body>
</html>
